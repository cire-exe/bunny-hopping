# Builds the mod and runs the unit tests on every push to main and every pull request, so a broken
# commit shows up straight away rather than when a release is tagged.
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request makes an older run pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build and test
        run: ./gradlew build

      - name: Keep the jar
        uses: actions/upload-artifact@v7
        with:
          name: bhop-jar
          path: build/libs/*.jar
          if-no-files-found: error
