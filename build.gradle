plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"bhop" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// Its own folder, so a dev server and client can run side by side without sharing logs or config.
		server {
			runDir "run/server"
		}
	}
}

// Client game tests live in src/gametest and run with `./gradlew runClientGameTest`. They start a
// real client, open worlds and press keys, so the multiplayer behaviour can be checked end to end.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "bhop-gametest"
		enableGameTests = false
		enableClientGameTests = true
	}
}

dependencies {
	// Minecraft 26.3 is distributed unobfuscated: no `mappings` entry, and mod
	// dependencies use plain `implementation` rather than `modImplementation`.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()
}

jar {
	def archiveName = project.base.archivesName.get()
	inputs.property "archiveName", archiveName

	from("LICENSE") {
		rename { "${it}_${archiveName}" }
	}
}
